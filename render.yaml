# Render Blueprint: hosted Jamarama demo (app/gateway.js).
# Each visitor gets their own room process. The local MLX Magenta engine is off (no Apple Silicon
# here); set TEXTURE_URL + TEXTURE_TOKEN (the mrt2-cloud GPU service) to stream the MRT2 texture
# layer from the cloud. Unset → band only.
services:
  - type: web
    name: jamarama-demo
    runtime: node
    rootDir: app
    plan: free            # free sleeps after ~15 min idle (~1 min cold start); "starter" stays awake
    buildCommand: echo "node_modules are bundled"
    startCommand: node gateway.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_ROOMS
        value: "4"
      - key: IDLE_MIN
        value: "10"
      - key: TEXTURE_URL          # https://<workspace>--mrt2-cloud-serve.modal.run (set in the dashboard)
        sync: false
      - key: TEXTURE_TOKEN        # the mrt2-cloud MRT2_TOKEN secret (set in the dashboard)
        sync: false
